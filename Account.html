<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | MentorLink</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase v9 compat (load before app JS) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App JS (after Firebase) -->
  <script src="mentorlink.js"></script>
</head>
<body>
  <header>
    <h1>My Account</h1>
    <nav>
      <a href="dashboard-1.html">Dashboard</a>
      <a href="MentorPage.html">Mentors</a>
      <a href="Landing.html">Home</a>
      <span class="logout" style="cursor:pointer">Logout</span>
    </nav>
  </header>
  <main>
    <section>
      <h2>Profile</h2>
      <form id="profile-form">
        <label for="profile-name">Full Name</label>
        <input type="text" id="profile-name" placeholder="Your Name">
        <label for="profile-email">Email</label>
        <input type="email" id="profile-email" disabled>
        <label for="profile-image">Profile Image</label>
        <input type="file" id="profile-image" accept="image/*">
        <img id="profile-img-preview" src="" alt="Profile Preview" style="max-width:120px;display:none;border-radius:50%;object-fit:cover;margin-top:8px;">
        <button type="submit">Save Profile</button>
      </form>
    </section>
  </main>
</body>
</html>
