      <input type="text" id="mentor-search" placeholder="Search by name or skill..." />

        <option value="design">Design</option>

      <div style="font-size:.9rem;color:#64748b">Loading mentors…</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;width:100%;padding:1rem">
